# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    # CHANGED: Now only targets 'main'.
    # If you also want to include 'master', change this to ["main", "master"]
    base_branches:
      - "main"
  tools:
    ast_grep:
      enabled: true
    linter:
      enabled: true
chat:
  auto_reply: true

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill" # Options: chill, assertive, high_level
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    # The pattern below ".*" enables reviews for PRs targeting ANY branch.
    # By default, this is set to only ["main", "master"].
    base_branches:
      - ".*" 
  tools:
    ast_grep:
      enabled: true
    linter:
      enabled: true
chat:
  auto_reply: true
